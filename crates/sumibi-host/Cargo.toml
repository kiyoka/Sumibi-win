[package]
name = "sumibi-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
spike = ["sumibi-ipc/spike"]

[dependencies]
sumibi-core = { path = "../sumibi-core" }
sumibi-protocol = { path = "../sumibi-protocol" }
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }
unicode-segmentation = "=1.13.3"

[dev-dependencies]

[build-dependencies]
embed-resource = "=3.0.12"

[target.'cfg(windows)'.dependencies]
sumibi-ipc = { path = "../sumibi-ipc" }
sumibi-credentials = { path = "../sumibi-credentials" }
sumibi-winhttp = { path = "../sumibi-winhttp" }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Console"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading"] }
