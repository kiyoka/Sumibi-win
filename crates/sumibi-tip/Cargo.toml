[package]
name = "sumibi-tip"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
spike = []

[target.'cfg(windows)'.dependencies]
sumibi-core = { path = "../sumibi-core" }
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_LibraryLoader", "Win32_UI_TextServices", "Win32_UI_Input_KeyboardAndMouse"] }
