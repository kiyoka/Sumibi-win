[package]
name = "sumibi-setup"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "sumibi-setup"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
sumibi-core = { path = "../sumibi-core" }
sumibi-protocol = { path = "../sumibi-protocol" }
sumibi-ipc = { path = "../sumibi-ipc" }
sumibi-host = { path = "../sumibi-host" }
windows-core = "=0.62.2"
sumibi-tip = { path = "../sumibi-tip", features = ["spike"] }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_LibraryLoader", "Win32_UI_Controls_RichEdit", "Win32_UI_TextServices", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
