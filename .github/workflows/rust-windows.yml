name: Windows Rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Test default build
        run: cargo test --workspace --locked
      - name: Test diagnostic build
        run: cargo test --workspace --features sumibi-host/spike --locked
      - name: Lint default build
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Lint diagnostic build
        run: cargo clippy --workspace --all-targets --features sumibi-host/spike --locked -- -D warnings
      - name: Build native DLL
        run: cargo build --workspace --locked
      - name: DLL load and mock TSF lifecycle
        run: cargo run -p sumibi-tip --features spike --example load_smoke --locked -- target/debug/sumibi_tip.dll
