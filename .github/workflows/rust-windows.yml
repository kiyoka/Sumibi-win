name: Windows Rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Installer regression fixtures (PowerShell 7)
        run: .\tools\Test-Installer.ps1
      - name: Installer regression fixtures (Windows PowerShell 5.1)
        shell: powershell
        run: .\tools\Test-Installer.ps1
      - name: Protected staging ACL policy (in-memory fixtures)
        run: .\tools\Test-SystemRegistrationDevAcl.ps1
      - name: Test default build
        run: cargo test --workspace --locked
      - name: Test diagnostic build
        run: cargo test --workspace --features sumibi-host/spike --locked
      - name: Lint default build
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Lint diagnostic build
        run: cargo clippy --workspace --all-targets --features sumibi-host/spike --locked -- -D warnings
      - name: Build native DLL
        run: cargo build --workspace --locked
      - name: Registration journal crash recovery (disposable HKCU fixture)
        run: .\target\debug\sumibi-setup.exe registration-transaction-test
      - name: Native COM and TSF registration (low-integrity redirected hives)
        run: .\tools\Test-NativeRegistrationBackend.ps1
      - name: DLL load and mock TSF lifecycle
        run: cargo run -p sumibi-tip --features spike --example load_smoke --locked -- target/debug/sumibi_tip.dll
      - name: Native TSF range replacement regression
        run: |
          cargo build -p sumibi-tip --features spike --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run -p sumibi-setup --locked -- edit-test --dll target/debug/sumibi_tip.dll
      - name: Build and verify distribution ZIP
        run: .\tools\New-DistributionPackage.ps1
